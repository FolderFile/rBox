[package]
name = "rbox"
version = "0.4.0"
edition = "2021"
description = "A Rust File Manager - self-hosted, multi-user file manager and web server"
license = "MIT"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
humantime = "2"
tokio-util = { version = "0.7.20", features = ["io"] }
mime_guess = "2.0.5"
async_zip = { version = "0.0.19", features = ["tokio", "deflate"] }
tower = { version = "0.5.3", features = ["util"] }
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["io", "std"] }
rust-embed = "8.13.0"
zip = { version = "9.0.4", default-features = false, features = ["aes-crypto", "deflate", "bzip2", "time"] }
tar = "0.4"
flate2 = "1"
zstd = "0.13"
xz2 = "0.1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
strip = true

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
zip = "9.0.4"
